services:
  backend:
    build:
      context: ./backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"